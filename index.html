<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сервис за Поправка на Гаража</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- <script src="/_sdk/element_sdk.js"></script> -->
 <!-- <script src="/_sdk/data_sdk.js"></script> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Russo+One&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
</head>

<body class="h-full font-body">
  <div id="app-container" class="h-full w-full overflow-auto"
    style="background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 75%, #000000 100%);">
    <div id="particles-container"
      style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;"></div>
    <!-- Header -->
    <header class="relative overflow-hidden" style="z-index: 10;">
      <div class="absolute inset-0 opacity-10">
        <div class="absolute top-10 left-10 w-32 h-32 border-4 border-amber-500 rounded-full"></div>
        <div class="absolute top-20 right-20 w-24 h-24 border-4 border-amber-500 rounded-full"></div>
        <div class="absolute bottom-10 left-1/3 w-16 h-16 border-4 border-amber-500 rounded-full"></div>
      </div>
      <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-col sm:flex-row items-center sm:items-start justify-between gap-4">
          <div class="flex items-center gap-3">
            <div
              class="w-28 h-28 sm:w-24 sm:h-24 rounded-full overflow-hidden border-2 border-amber-400 bg-white/10 flex items-center justify-center shadow-lg">
              <img src="images/logo.png" alt="Лого" class="w-full h-full object-cover"
                onerror="this.style.display='none'" />
            </div>
            <div>
              <h1 id="business-name"
                class="font-heading text-3xl sm:text-4xl md:text-5xl text-white tracking-wide leading-tight">Авто Лакер
                Моте</h1>
              <p id="tagline" class="text-amber-400 text-base sm:text-lg mt-1">Експертна Нега за Ваше Возило</p>
            </div>
          </div>
          <div class="flex items-center gap-6 text-gray-300">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
              <a href="tel:+38978530535" class="font-medium">+389 78 530 535</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->

    <nav class="max-w-6xl mx-auto px-4" style="z-index: 10; position: relative;">
      <div class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-2 border-b border-gray-700">
        <button id="tab-services"
          class="tab-btn flex-1 sm:flex-none px-4 sm:px-6 py-3 text-amber-400 border-b-2 border-amber-500 font-semibold transition-all"
          onclick="showTab('services')"> Наши Услуги </button>
        <button id="tab-booking"
          class="tab-btn flex-1 sm:flex-none px-4 sm:px-6 py-3 text-gray-400 hover:text-amber-400 font-semibold transition-all"
          onclick="showTab('booking')"> Закажи Прием </button>
        <button id="tab-appointments"
          class="tab-btn flex-1 sm:flex-none px-4 sm:px-6 py-3 text-gray-400 hover:text-amber-400 font-semibold transition-all"
          onclick="showTab('appointments')"> Приеми <span id="booking-count"
            class="ml-1 bg-amber-500 text-gray-900 text-xs px-2 py-0.5 rounded-full">0</span> </button>
      </div>
    </nav>

    <!-- Services Section -->

    <section id="section-services" class="max-w-6xl mx-auto px-6 py-10" style="z-index: 10; position: relative;">
      <h2 class="font-heading text-2xl text-white mb-8 flex items-center gap-3">
        <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg> Професионални Услуги
      </h2>
      <div id="services-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

        <!-- Services will be rendered here -->

      </div>
    </section>

    <!-- Gallery Section -->

    <section id="section-gallery" class="max-w-6xl mx-auto px-6 py-10" style="z-index: 10; position: relative;">
      <h2 class="font-heading text-2xl text-white mb-8 flex items-center gap-3">
        <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg> Галерија Пред/Потоа
      </h2>
      <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6"></div>
    </section>

    <!-- Booking Section -->

    <section id="section-booking" class="max-w-6xl mx-auto px-6 py-10 hidden" style="z-index: 10; position: relative;">
      <h2 class="font-heading text-2xl text-white mb-8 flex items-center gap-3">
        <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg> Закажи Прием
      </h2>
      <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-8 border border-gray-700">
        <form id="booking-form" class="space-y-6">
          <div class="grid md:grid-cols-2 gap-6">
            <div><label for="customer-name" class="block text-gray-300 font-medium mb-2">Твое Име *</label> <input
                type="text" id="customer-name" required
                class="w-full bg-gray-700/50 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                placeholder="Внеси го твоето име">
            </div>
            <div><label for="customer-phone" class="block text-gray-300 font-medium mb-2">Телефонски Број *</label>
              <input type="tel" id="customer-phone" required
                class="w-full bg-gray-700/50 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                placeholder="Внеси го твоето телефонски број">
            </div>
          </div>
          <div class="grid md:grid-cols-2 gap-6">
            <div><label for="vehicle-info" class="block text-gray-300 font-medium mb-2">Возило (Година/Марка/Модел)
                *</label> <input type="text" id="vehicle-info" required
                class="w-full bg-gray-700/50 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                placeholder="Внеси го твоето возило">
            </div>
            <div><label for="service-type" class="block text-gray-300 font-medium mb-2">Потребна Услуга *</label>
              <select id="service-type" required
                class="w-full bg-gray-700/50 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
                <option value="">Избери услуга</option>
              </select>
            </div>
          </div>
          <div class="grid md:grid-cols-2 gap-6">
            <div><label for="preferred-date" class="block text-gray-300 font-medium mb-2">Префериран Датум *</label>
              <input type="date" id="preferred-date" required
                class="w-full bg-gray-700/50 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
            </div>
            <div><label for="notes" class="block text-gray-300 font-medium mb-2">Дополнителни Забелешки</label> <input
                type="text" id="notes"
                class="w-full bg-gray-700/50 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                placeholder="Какви било специфични проблеми или барања">
            </div>
          </div>
          <div class="flex items-center gap-4 pt-4"><button type="submit" id="submit-btn"
              class="btn-primary bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-gray-900 font-bold py-4 px-8 rounded-xl transition-all duration-300 flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg><span id="submit-btn-text">Закажи Прием</span> </button>
            <div id="form-message" class="text-sm hidden"></div>
          </div>
        </form>
      </div>
    </section>
    
    <!-- Appointments Section -->

    <section id="section-appointments" class="max-w-6xl mx-auto px-6 py-10 hidden"
      style="z-index: 10; position: relative;">
      <h2 class="font-heading text-2xl text-white mb-8 flex items-center gap-3">
        <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg> Закажани Приеми
      </h2>
      <div id="appointments-list" class="space-y-4">
        
        <!-- Appointments will be rendered here -->

      </div>
      <div id="no-appointments"
        class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-12 border border-gray-700 text-center">
        <svg class="w-16 h-16 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p class="text-gray-400 text-lg">Нема закажани приеми</p><button onclick="showTab('booking')"
          class="mt-4 text-amber-400 hover:text-amber-300 font-semibold"> Закажи прв прием → </button>
      </div>
    </section>
    
    <!-- Footer -->

    <footer class="max-w-6xl mx-auto px-6 py-8 border-t border-gray-700 mt-10">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="text-gray-400 space-y-3">
          <p id="address-display" class="flex items-center gap-2">
            <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Маршал Тито ББ, С.Прибачево, Кочани
          </p>
          <p><strong>Работно време:</strong> Пон-Саб 08:00-18:00, Неделa Затворено</p>
          <p><strong>Телефон:</strong> <a href="tel:+38978530535" class="text-amber-400 hover:text-amber-300">+389 78
              530 535</a></p>
          <p><strong>WhatsApp:</strong> <a href="https://wa.me/38978530535" target="_blank" rel="noopener noreferrer"
              class="text-emerald-400 hover:text-emerald-300">Пиши ни</a></p>
        </div>
        <div class="rounded-2xl overflow-hidden border border-gray-700">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1485.098140434834!2d22.4397861624924!3d41.88863567341437!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x13558de8445673a1%3A0x4fa541f05915bcb9!2sAvto%20Laker%20Mote!5e0!3m2!1sen!2sch!4v1773487881551!5m2!1sen!2sch"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </footer>
  </div>
